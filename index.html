<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruby Sandbox - Online Ruby Playground</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="An interactive Ruby playground and sandbox environment. Run Ruby code directly in your browser using WebAssembly."
    />
    <meta
      name="keywords"
      content="ruby playground, online ruby playground, Ruby, Ruby 4, WebAssembly, WASM, Sandbox, Online Compiler"
    />
    <meta name="author" content="Artem Blazhievskii" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ablzh.github.io/ruby-sandbox/" />
    <meta property="og:title" content="Ruby Sandbox - Online Ruby Playground" />
    <meta
      property="og:description"
      content="An interactive Ruby playground and sandbox environment. Run Ruby code directly in your browser using WebAssembly."
    />
    <meta property="og:image" content="https://ablzh.github.io/ruby-sandbox/social-media-img.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ablzh.github.io/ruby-sandbox/" />
    <meta
      name="twitter:title"
      content="Ruby Sandbox - Online Ruby Playground"
    />
    <meta
      name="twitter:description"
      content="An interactive Ruby playground and sandbox environment. Run Ruby code directly in your browser using WebAssembly."
    />
    <meta name="twitter:image" content="https://ablzh.github.io/ruby-sandbox/social-media-img.jpg" />

    <!-- Canonical Link -->
    <link rel="canonical" href="https://ablzh.github.io/ruby-sandbox/" />

    <!-- Google Search console HTML tag  -->
    <meta name="google-site-verification" content="gjC25BTT0X_n5r6oa2vieQS5YORJOUaSwwmwcbgUfsE" />

  </head>
  <body>
    <!-- Navbar and Banner are injected by src/layout.js -->

    <!-- Workspace Grid -->
    <div class="workspace" id="workspace">
      <!-- Left Column: Editor -->
      <div class="pane editor-pane">
        <div class="pane-header">Editor Window</div>
        <div id="editor" class="monaco-container"></div>
      </div>

      <!-- Right Column: Output -->
      <div class="pane output-pane" id="output-pane">
        <div class="pane-header">Output Window</div>
        <div id="output" class="output-container">
          <div class="initial-state" id="initial-state">
            <button id="btn-load-ruby">Load Ruby Runtime</button>
          </div>
          <div class="loading-state hidden" id="loading-state">
            <div class="spinner"></div>
            <div class="progress-text" id="progress-text">
              Downloading Ruby... 0%
            </div>
          </div>
        </div>

        <!-- Input Container -->
        <div id="input-container" class="input-container hidden">
          <span class="prompt-label">&gt;</span>
          <input
            type="text"
            id="input-field"
            class="input-field"
            autocomplete="off"
          />
        </div>
      </div>
    </div>

    <!-- Footer is injected by src/layout.js -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
